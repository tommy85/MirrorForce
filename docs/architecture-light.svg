<text class="t-sub" x="62" y="569">one summary token each</text>
<rect class="node-org" x="48" y="588" width="200" height="44" rx="9"/>
<text class="t-title" x="62" y="610">Legal actions</text>
<text class="t-sub" x="62" y="627">one query per action</text>
<rect class="node-org" x="300" y="410" width="220" height="52" rx="9"/>
<text class="t-title" x="314" y="432">Set transformer</text>
<text class="t-sub" x="314" y="449">board · 4 layers · d=384</text>
<rect class="node-org" x="300" y="497" width="220" height="52" rx="9"/>
<text class="t-title" x="314" y="519">Causal transformer</text>
<text class="t-sub" x="314" y="536">events + summaries · 2 layers</text>
<path class="edge" d="M248,436 L297,436" marker-end="url(#arw)"/>
<path class="edge" d="M248,494 L297,513" marker-end="url(#arw)"/>
<path class="edge" d="M248,552 L297,533" marker-end="url(#arw)"/>
<path class="edge" d="M520,436 L548,436"/>
<path class="edge" d="M520,523 L548,523"/>
<path class="edge" d="M548,436 L548,586"/>
<rect class="node-org" x="576" y="410" width="240" height="48" rx="9"/>
