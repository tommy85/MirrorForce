<text class="t-title" x="530" y="126">Room server</text>
<text class="t-sub" x="530" y="143">YGOPro protocol</text>
<rect class="node-mag" x="752" y="104" width="160" height="64" rx="9" stroke-dasharray="6 4"/>
<text class="t-title" x="766" y="126">Follower + search</text>
<text class="t-sub" x="766" y="143">optional local engine</text>
