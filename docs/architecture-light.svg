<text class="t-title" x="298" y="254">Learner</text>
<text class="t-sub" x="298" y="271">PPO-clip + magnet KL</text>
<text class="t-sub" x="298" y="286">critic sees hidden cards</text>
<path class="edge" d="M106,168 L106,229" marker-end="url(#arw)"/>
<text class="lbl" x="98" y="204" text-anchor="end">observations</text>
