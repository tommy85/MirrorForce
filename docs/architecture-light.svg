<text class="t-sub" x="298" y="143">lethal lines, set timing</text>
<rect class="node-teal" x="48" y="232" width="160" height="64" rx="9"/>
<text class="t-title" x="62" y="254">Actors</text>
<text class="t-sub" x="62" y="271">self-play, current policy</text>
