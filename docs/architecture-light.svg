<text class="t-sub" x="590" y="449">win · draw · loss</text>
<rect class="node-org" x="576" y="478" width="240" height="48" rx="9" stroke-dasharray="6 4"/>
<text class="t-title" x="590" y="500">Belief head</text>
<text class="t-sub" x="590" y="517">opponent's hidden cards</text>
<rect class="node-org" x="576" y="572" width="240" height="52" rx="9"/>
<text class="t-title" x="590" y="594">Policy head</text>
<text class="t-sub" x="590" y="611">action queries attend to cards</text>
<path class="edge" d="M548,434 L573,434" marker-end="url(#arw)"/>
<path class="edge" d="M548,502 L573,502" marker-end="url(#arw)"/>
<path class="edge" d="M548,586 L573,586" marker-end="url(#arw)"/>
<path class="edge" d="M248,610 L573,610" marker-end="url(#arw)"/>
<path class="edge" d="M816,434 L846,434" marker-end="url(#arw)"/>
