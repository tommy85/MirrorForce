<text class="t-sub" x="530" y="271">sees what a player sees</text>
<rect class="node-mag" x="752" y="232" width="160" height="64" rx="9"/>
<text class="t-title" x="766" y="254">Policy service</text>
<text class="t-sub" x="766" y="271">GPU, batched RPC</text>
<path class="edge" d="M556,168 L556,229" marker-end="url(#arw)"/>
<text class="lbl" x="548" y="204" text-anchor="end">messages</text>
<path class="edge" d="M598,232 L598,171" marker-end="url(#arw)"/>
