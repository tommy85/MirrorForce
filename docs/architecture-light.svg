<text class="lbl" x="714" y="245" text-anchor="middle">decide</text>
<path class="edge" d="M752,284 L679,284" marker-end="url(#arw)"/>
<text class="lbl" x="714" y="302" text-anchor="middle">action</text>
<path class="edge-dash" d="M660,232 L660,188 L712,188 L712,136 L749,136" marker-end="url(#arw)"/>
<text class="lbl" x="720" y="204" text-anchor="start">look-ahead</text>
<path class="edge" d="M364,310 L364,342 L832,342 L832,299" marker-end="url(#arw)"/>
<text class="lbl" x="600" y="336" text-anchor="middle">checkpoint</text>
<rect class="panel" x="24" y="366" width="912" height="284" rx="14"/><circle class="dot-org" cx="48" cy="393" r="5"/><text class="hdr" x="62" y="397">POLICY NETWORK</text>
<path class="edge-dash" d="M748,393 L776,393"/>
<text class="lbl" x="784" y="397" text-anchor="start">optional or auxiliary</text>
<rect class="node-org" x="48" y="414" width="200" height="44" rx="9"/>
<text class="t-title" x="62" y="436">Cards</text>
<text class="t-sub" x="62" y="453">database fields + Lua script</text>
<rect class="node-org" x="48" y="472" width="200" height="44" rx="9"/>
<text class="t-title" x="62" y="494">Turn events</text>
<text class="t-sub" x="62" y="511">this turn's public events</text>
<rect class="node-org" x="48" y="530" width="200" height="44" rx="9"/>
